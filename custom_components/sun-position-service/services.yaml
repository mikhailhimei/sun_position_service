get_state:
  name: Get Sunlight State
  description: Calculates solar coverage and blinds state with hysteresis and lux measurement.
  fields:
    window_azimuths:
      name: Window Azimuth(s)
      description: Single azimuth (e.g. 110) or range list [40, 135].
      example: [40, 135]
      selector:
        object:
    lum:
      name: Illuminance (Lux)
      description: Direct float lux value or template variable.
      example: 10500
      selector:
        object:
    previous_state:
      name: Previous State
      description: Current state of the blind to apply hysteresis.
      default: "open"
      example: "open | side | slightly | direct"
      selector:
        object:
    required_brightness_percent:
      name: "Требуемая яркость, %"
      description: "100% — текущие пороги; 150% — для закрытия потребуется в 1,5 раза больше света. Влияет на пороги открытия и закрытия, включая прямое попадание солнца. Без lum не применяется."
      default: 100
      example: 150
      selector:
        number:
          min: 1
          max: 500
          step: 1
          mode: box
          unit_of_measurement: "%"
